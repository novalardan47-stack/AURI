<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rekrutmen | AURI Roleplay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <img src="logo-auri.png" alt="Logo AURI" class="logo-auri">

        <h1>AURI</h1>

        <p>Swa Bhuwana Paksa</p>

    </header>

    <main>

        <h2>Formulir Rekrutmen</h2>

        <p>Silakan isi data berikut untuk mendaftar AURI Roleplay.</p>

        <form id="form-rekrutmen">

            <label>Username Roblox</label>
            <input type="text" placeholder="Masukkan username Roblox">

            <label>Nama RP</label>
            <input type="text" placeholder="Masukkan nama RP">

            <label>Umur</label>
            <input type="number" placeholder="Masukkan umur">

            <label>Discord</label>
            <input type="text" placeholder="Username Discord">

            <label>Satuan yang dipilih</label>

            <select>
                <option>POMAU</option>
                <option>Kodiklatau</option>
                <option>Kopasgat</option>
                <option>Skadron</option>
            </select>

            <button type="submit">
    Kirim Pendaftaran
</button>

<button type="button" onclick="salinFormat()">
    Salin Format ON DUTY
</button>

<p id="status-salin"></p>
        </form>

    </main>

</main>

<script src="script.js"></script>

</body>
